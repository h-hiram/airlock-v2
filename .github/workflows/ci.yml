name: Airlock CI & Quality Gate

on:
  push:
    branches: [ main, features/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security & Unit Test Suite (71 Tests across 14 Suites)
        run: npm test

      - name: Verify Production Bundle Build
        run: npm run build
